            city_name: PATI
            zip_code: '59171'
  - name: Calculate delivery price
    api: openapi/komerce-shipping-delivery-openapi.yml
    operation: calculateDeliveryPrice
    request:
      method: GET
      url: https://api-sandbox.collaborator.komerce.id/tariff/api/v1/calculate?shipper_destination_id=31597&receiver_destination_id=46116&weight=1&item_value=300000&cod=yes&origin_pin_point=-7.279849431298132,109.35114360314475&destination_pin_point=-7.30585,109.36814
      headers:
        x-api-key: inputapikey
    response:
      status: 200
      note: data carries calculate_reguler, calculate_cargo and calculate_instant arrays.
  - name: Create a delivery order
    api: openapi/komerce-shipping-delivery-openapi.yml
    operation: storeOrder
    request:
