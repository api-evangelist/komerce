            label: PURWOKERTO, NGADILUWIH, KEDIRI, 64171
            subdistrict_name: PURWOKERTO
            district_name: NGADILUWIH
            city_name: KEDIRI
            zip_code: '64171'
          - id: 67150
            label: PURWOKERTO, KAYEN, PATI, 59171
