  - name: Get payment methods
    api: openapi/komerce-payment-openapi.yml
    operation: getPaymentMethods
    request:
      method: GET
      url: https://api-sandbox.collaborator.komerce.id/user/api/v1/user/methods
      headers:
        x-api-key: YOUR_API_KEY
    response:
      status: 200
      body:
        meta:
          message: success get payment methods
          code: 200
          status: success
        data:
          - payment_type: va
            display_name: Bank Central Asia
            bank_code: BCA
            logo_url: https://storage.googleapis.com/komerce/assets/logo/bca.png
            min_amount: 10000
            max_amount: 999999999999
            currency: IDR
  - name: Upload a QRIS image
    api: openapi/komerce-qrisly-openapi.yml
    operation: uploadQris
    request:
      method: POST
      url: https://api-sandbox.collaborator.komerce.id/user/api/v1/qrisly/upload-qris
      headers:
        X-API-Key: your_api_key_here
      form:
        name: ABC Online Store
        qris_image: '@/path/to/qris.png'
    response:
      status: 200
      body:
        success: true
        message: QRIS successfully uploaded and validated
        data:
          qris_id: 9d6c9f9e-8c33-4f42-8b1f-0e6a3e2e7d10
          provider: DANA
          name: ABC Store
          merchant_name: ABC Store
          created_at: '2026-03-03 14:00:54'
  - name: Generate a dynamic QRIS
    api: openapi/komerce-qrisly-openapi.yml
    operation: generateQris
    request:
      method: POST
      url: https://api-sandbox.collaborator.komerce.id/user/api/v1/qrisly/generate-qris
      headers:
        X-API-Key: your_api_key_here
        Content-Type: application/json
      body:
        qris_id: 123
        amount: 100000
        output_type: string
        unique_amount: true
    response:
      status: 200
      body:
        success: true
        message: QRIS successfully generated
        data:
          history_id: 1778
          original_amount: 1000
          final_amount: 1003
          payment_status: unpaid
          expiry_time: '2026-03-03 14:52:52'
      note: The documented response also carries a long qris_string EMVCo QR payload, omitted here.
