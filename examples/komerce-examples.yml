note: >-
  Request and response examples published verbatim in the Komerce documentation. Values shown
  are the provider's own illustrative samples, not test fixtures.
examples:
  - name: Search domestic destination
    api: openapi/komerce-shipping-cost-openapi.yml
    operation: searchDomesticDestination
    request:
      method: GET
      url: https://rajaongkir.komerce.id/api/v1/destination/domestic-destination?search=jakarta&limit=5&offset=0
      headers:
        key: inputapikey
    response:
      status: 200
      body:
        meta:
          message: Success Get Domestic Destinations
          code: 200
          status: success
        data: []
      note: The docs render data[] entries as templated placeholders (id, label, province_name, city_name, district_name, subdistrict_name, zip_code).
  - name: Calculate domestic cost
    api: openapi/komerce-shipping-cost-openapi.yml
    operation: calculateDomesticCost
    request:
      method: POST
      url: https://rajaongkir.komerce.id/api/v1/calculate/domestic-cost
      headers:
        key: inputapikey
        Content-Type: application/x-www-form-urlencoded
      form:
        origin: '{{ origin.id }}'
        destination: '{{ destination.id }}'
        weight: '{{ weight.grams }}'
        courier: '{{ courier.code }}'
        price: '{{ lowest/highest }}'
    response:
      status: 200
      body:
        meta:
          message: Success Calculate Domestic Shipping cost
          code: 200
          status: success
      note: data[] entries carry name, code, service, description, cost and etd.
  - name: Search delivery destination
    api: openapi/komerce-shipping-delivery-openapi.yml
    operation: searchDeliveryDestination
    request:
      method: GET
      url: https://api-sandbox.collaborator.komerce.id/tariff/api/v1/destination/search?keyword=53131
      headers:
        x-api-key: yourapikey
    response:
      status: 200
      body:
        meta:
          message: Sucessfully Get Destination Data
          code: 200
          status: success
        data:
