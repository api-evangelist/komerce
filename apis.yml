aid: komerce
name: Komerce
description: >-
  Komerce is an Indonesian end-to-end e-commerce enabler serving more than 50,000 online
  sellers and SMEs with an integrated suite covering fulfilment, logistics, marketplace
  operations, CRM, advertising and payments — Komship, Kompack, Komplace, Komchat, Komcards,
  Komtim, Komads and Komclass. Its developer surface is published under the RajaOngkir brand
  and exposes four APIs: Shipping Cost (Cek Ongkir) for domestic and international rate
  lookup and airway-bill tracking across 17 Indonesian couriers, Shipping Delivery (Komship)
  for creating orders, requesting pickup, printing labels and tracking shipments, Payment
  Service for Virtual Account and QRIS transactions with signed callbacks, and QRISLY for
  turning a static QRIS into dynamic per-transaction QRIS codes. All four authenticate with a
  per-product header API key issued from the Collaborator dashboard, and the delivery,
  payment and QRIS products run a full isolated sandbox.
